name: CI and SWA deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_PROJECT_ID: ${{ vars.PROJECT_ID }}
      VITE_REPOSITORY_ID: ${{ vars.ADO_REPOSITORY_ID }}
      VITE_GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck && pnpm check
      - run: pnpm --filter @manual-test-manager/api --prod deploy .artifacts/api
      - run: node scripts/prepare-swa.mjs
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || '00000000-0000-0000-0000-000000000000' }}
      - run: NODE_ENV=test node --input-type=module -e 'await import("./.artifacts/api/dist/index.js")'
      - run: tar -czf swa.tar.gz .artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: swa
          path: swa.tar.gz
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: swa
      - run: tar -xzf swa.tar.gz
      - name: Require production tenant
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          test -n "$AZURE_TENANT_ID"
          test "$AZURE_TENANT_ID" != "00000000-0000-0000-0000-000000000000"
          grep -F "$AZURE_TENANT_ID" .artifacts/web/staticwebapp.config.json
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: .artifacts/web
          api_location: .artifacts/api
          output_location: ""
          skip_app_build: true
          skip_api_build: true
